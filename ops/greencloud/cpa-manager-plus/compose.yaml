services:
  cpa-manager-plus:
    image: seakee/cpa-manager-plus@sha256:02d16100da1dd3d717061cc314e30b430d3eea44e1019730ecaa9536593e975e
    container_name: cpa-manager-plus
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_ADDR: "127.0.0.1:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      CPA_MANAGER_DATA_KEY_PATH: "/data/data.key"
      CPA_UPSTREAM_URL: "http://127.0.0.1:8317"
      CPA_MANAGER_ADMIN_KEY_FILE: "/run/secrets/cpa_admin_key"
      CPA_MANAGEMENT_KEY_FILE: "/run/secrets/cpa_management_key"
      USAGE_COLLECTOR_MODE: "auto"
      USAGE_RESP_QUEUE: "usage"
      USAGE_RESP_POP_SIDE: "right"
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "https://cpamp.tryvalo.com"
      TZ: "Asia/Shanghai"
    volumes:
      - /srv/cpa-manager-plus/data:/data
      - /srv/cpa-manager-plus/secrets/cpamp-admin-key:/run/secrets/cpa_admin_key:ro
      - /srv/cpa-manager-plus/secrets/cpa-management-key:/run/secrets/cpa_management_key:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
